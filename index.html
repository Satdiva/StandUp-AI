<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Comedy Deck v3 Interactive</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f0f14;
        color: white;
    }

    .banner {
        padding: 20px;
        text-align: center;
        background: linear-gradient(90deg, #6a11cb, #2575fc);
        font-size: 20px;
        font-weight: bold;
    }

    .container {
        padding: 15px;
        max-width: 800px;
        margin: auto;
    }

    .comedian-bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 15px;
    }

    .comedian {
        padding: 8px 12px;
        background: #1c1c26;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    .comedian.active {
        background: #2575fc;
    }

    .joke-box {
        background: #1a1a22;
        padding: 20px;
        border-radius: 12px;
        min-height: 120px;
        font-size: 18px;
        line-height: 1.4;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .controls {
        display: flex;
        justify-content: space-between;
        margin-top: 15px;
    }

    button {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #2575fc;
        color: white;
        font-size: 14px;
    }

    button:active {
        transform: scale(0.97);
    }

    .footer {
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.7;
        text-align: center;
    }
</style>
</head>

<body>

<div class="banner">
    🎤 Comedy Deck v3 — Interactive Joke Engine (Free Tier Safe Build)
</div>

<div class="container">

    <div class="comedian-bar" id="comedianBar"></div>

    <div class="joke-box" id="jokeBox">Loading jokes...</div>

    <div class="controls">
        <button onclick="prevJoke()">⬅ Prev</button>
        <button onclick="nextJoke()">Next ➡</button>
    </div>

    <div class="footer">
        Built as a single-file interactive system • No APIs • No dependencies • Offline safe
    </div>

</div>

<script>
// ===================== DATA =====================

const data = {
    "Grok Bhangra": [

        "My brain has too many tabs open and none are loading.",
        "I bought gym membership… now I identify as a “subscription holder”.",
        "My sleep schedule is like crypto — volatile and disappointing.",
        "I don’t have trust issues… I have WiFi issues.",
        "My motivation left the chat and never rejoined.",
        "I tried to be productive… got distracted by my own breathing.",
        "Even my shadow looks tired of me."
    ],

    "Gemini Firmware": [
        "Updating personality… please do not turn off human.",
        "Error 404: Motivation not found in system directory.",
        "I tried to optimize happiness but ran out of RAM.",
        "System notice: feelings.exe has stopped responding.",
        "Rebooting confidence… loading stuck at 12%.",
        "AI detected user sarcasm… escalating joke quality.",
        "Installing confidence patch v2.1… failed.",
        "My emotional cache needs clearing.",
        "Low battery mode: socially awkward responses enabled.",
        "Compilation complete: still confused but faster."
    ],

    "Neon Uncle": [
        "Back in my day, WiFi had commitment issues too… it just called it dial-up.",
        "I told my kids I walked 10km… they asked why I didn’t teleport.",
        "My doctor said I need more iron… so I started lifting spoons.",
        "I don’t argue online anymore… I just yell at my phone screen politely.",
        "Inflation is so bad, even my memories got downgraded.",
        "I tried TikTok… now my back hurts emotionally.",
        "They said ‘act your age’ so I cried in retirement.",
        "My knees crack more than my phone screen.",
        "I don’t need Google Maps, I have wrong directions confidence.",
        "Sleep is free but I still can’t afford it."
    ],

    "Cyber Sadhu": [
        "I achieved enlightenment… then lost password to it.",
        "My chakras are aligned but my WiFi isn’t.",
        "Inner peace loading… buffering at 99%.",
        "I meditated so hard I became a loading screen.",
        "Detachment level: I don’t even reply to my own thoughts.",
        "I asked the universe for signs… got ads instead.",
        "My aura is on airplane mode.",
        "Silence is golden but my notifications are louder.",
        "I transcended reality but still can’t transcend Mondays.",
        "Enlightenment achieved… trial version expired."
    ],

    "Tech Bro Therapist": [
        "Let’s process your trauma… but make it scalable.",
        "Have you tried turning your emotions off and on again?",
        "Your feelings are valid but poorly optimized.",
        "We need to refactor your coping mechanisms.",
        "That breakup has a memory leak.",
        "You’re not broken… you’re just in beta.",
        "Your sadness is not a bug, it’s a feature request.",
        "Let’s deploy emotional stability patch v1.0.",
        "You don’t need closure, you need better architecture.",
        "Your anxiety is just background processes running wild."
    ],

    "Bollywood Bot": [
        "Main emotional ho gaya… system hang ho gaya.",
        "Tum jo aaye zindagi mein… WiFi lag gaya.",
        "Mera dil bhi slow motion mein toot ta hai.",
        "Love story updated… now incompatible devices.",
        "Ishq mein buffering hoti hai.",
        "Hero entry delayed due to technical difficulties.",
        "Villain bhi ab software update maangta hai.",
        "Drama level: Bollywood plus lag.",
        "Mujhe pyaar hua… error 500.",
        "End credits mein bhi heartbreak chalta hai."
    ],

    "Quantum Chaiwala": [
        "I exist in multiple moods until someone talks to me.",
        "My tea is both hot and cold until I sip it.",
        "Customers are coming and not coming at the same time.",
        "I spilled chai… now reality has two timelines.",
        "My stall is everywhere and nowhere at once.",
        "Order confirmed and unconfirmed simultaneously.",
        "Quantum physics is easy… chai is harder.",
        "Time is relative… especially when waiting for payment.",
        "I charge for tea and emotional uncertainty.",
        "Every sip collapses probability into regret."
    ]
};

// ===================== STATE =====================

let currentComedian = Object.keys(data)[0];
let currentIndex = 0;

// ===================== INIT =====================

const comedianBar = document.getElementById("comedianBar");
const jokeBox = document.getElementById("jokeBox");

function init() {
    Object.keys(data).forEach(name => {
        const btn = document.createElement("div");
        btn.className = "comedian";
        if (name === currentComedian) btn.classList.add("active");

        btn.innerText = name;
        btn.onclick = () => switchComedian(name);

        comedianBar.appendChild(btn);
    });

    renderJoke();
}

// ===================== CORE =====================

function switchComedian(name) {
    currentComedian = name;
    currentIndex = 0;

    document.querySelectorAll(".comedian").forEach(el => {
        el.classList.remove("active");
        if (el.innerText === name) el.classList.add("active");
    });

    renderJoke();
}

function renderJoke() {
    const jokes = data[currentComedian];
    jokeBox.innerText = jokes[currentIndex];
}

function nextJoke() {
    const jokes = data[currentComedian];
    currentIndex = (currentIndex + 1) % jokes.length;
    renderJoke();
}

function prevJoke() {
    const jokes = data[currentComedian];
    currentIndex = (currentIndex - 1 + jokes.length) % jokes.length;
    renderJoke();
}

// ===================== SAFE AUDIO HOOK (NO CRASH) =====================

function playAudioSafe(url) {
    try {
        const audio = new Audio(url);
        audio.volume = 0.5;
        audio.play().catch(() => {
            // silently fail (browser restrictions)
        });
    } catch (e) {
        // never break app
    }
}

// ===================== START =====================

init();

</script>

</body>
</html>
