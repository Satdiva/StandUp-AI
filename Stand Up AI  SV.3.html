<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StandUp AI V3.1 — Coherence as a Product</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0e0f14;
    color: #fff;
}

header {
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(135deg, #ff3d6e, #6a5cff);
}

h1 { margin: 0; }

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: #171826;
    padding: 18px;
    border-radius: 14px;
    margin-top: 15px;
}

.langs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 15px;
}

button {
    background: #1f2030;
    color: white;
    border: 1px solid #333;
    padding: 8px 10px;
    border-radius: 10px;
    cursor: pointer;
}

button:hover {
    background: #2b2d44;
}

.small {
    opacity: 0.7;
    font-size: 0.9rem;
}
</style>
</head>

<body>

<header>
    <h1>🎤 StandUp AI V3.1</h1>
    <p class="small">Coherence as a Product — Static Chaos Engine</p>

    <div class="langs">
        <button onclick="setLang('en')">🇺🇸 Original Chaos</button>
        <button onclick="setLang('pt')">🇧🇷 Caos Premium</button>
        <button onclick="setLang('es')">🇪🇸 Modo Baperebup</button>
        <button onclick="setLang('fr')">🇫🇷 Existential Chic</button>
        <button onclick="setLang('de')">🇩🇪 Precisely Confused</button>
        <button onclick="setLang('jp')">🇯🇵 Buffering Spirit</button>
        <button onclick="setLang('zh')">🇨🇳 Coherence DLC</button>
    </div>
</header>

<div class="container">

<div class="card">
    <h2 id="title"></h2>
    <p id="intro"></p>
</div>

<div class="card">
    <h3>😆 StandUp Compilation Feed</h3>
    <p id="joke"></p>
</div>

<div class="card">
    <h3>🎭 Stage Note</h3>
    <p id="note" class="small"></p>
</div>

</div>

<script>
const data = {
    en: {
        title: "Welcome to StandUp AI",
        intro: "A comedy engine where coherence is optional and chaos is curated.",
        joke: "Baperebup entered the stage and the microphone started buffering emotionally.",
        note: "Audience detected: 42% human, 58% confused WiFi signals."
    },
    pt: {
        title: "Bem-vindo ao StandUp AI",
        intro: "Um motor de comédia onde coerência é opcional e o caos é curado.",
        joke: "Baperebup entrou no palco e o microfone entrou em crise existencial.",
        note: "Plateia detectada: 42% humanos, 58% Wi-Fi confuso."
    },
    es: {
        title: "Bienvenido a StandUp AI",
        intro: "Un motor de comedia donde el caos está curado pero la coherencia no.",
        joke: "Baperebup apareció y el teatro perdió la conexión emocional.",
        note: "Audiencia: mitad humana, mitad señal WiFi con dudas."
    },
    fr: {
        title: "Bienvenue à StandUp AI",
        intro: "Un moteur comique où le chaos est organisé mais la cohérence opcional.",
        joke: "Baperebup est monté sur scène et a déclenché une crise philosophique du micro.",
        note: "Public: 40% humain, 60% existentialisme réseau."
    },
    de: {
        title: "Willkommen bei StandUp AI",
        intro: "Eine Comedy-Engine: Chaos strukturiert, Kohärenz optional.",
        joke: "Baperebup betrat die Bühne und alles wurde exakt falsch interpretiert.",
        note: "Publikum: teilweise menschlich, teilweise technische Verwirrung."
    },
    jp: {
        title: "StandUp AIへようこそ",
        intro: "カオスは設計され、コヒーレンスは任意のコメディエンジン。",
        joke: "Baperebupが登場した瞬間、マイクが感情的にバッファリングした。",

    zh: {

function setLang(lang) {
    document.getElementById("title").innerText = data[lang].title;
    document.getElementById("intro").innerText = data[lang].intro;
    document.getElementById("joke").innerText = data[lang].joke;
    document.getElementById("note").innerText = data[lang].note;
}

// default
setLang("en");
</script>

</body>
</html>
